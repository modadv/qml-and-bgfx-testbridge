name: MCP and Template Checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python-checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install MCP package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e tools/testbridge-mcp[dev]
      - name: Run MCP unit tests
        run: python -m pytest tools/testbridge-mcp/testbridge_mcp/tests tests/test_template_manifest.py -q

